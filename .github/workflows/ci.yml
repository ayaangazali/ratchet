name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check ratchet tests scripts
      - name: types
        run: mypy ratchet --ignore-missing-imports
      - name: tests
        # no docker, no network: the same thing the demo relies on
        run: python -m pytest -q
      - name: the verifier's own eval
        run: |
          python -m ratchet.cli demo --dir demo-repo
          git -C demo-repo config user.email ci@ratchet && git -C demo-repo config user.name ci
          python -m ratchet.cli redteam --repo demo-repo
