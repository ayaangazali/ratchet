name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check src tests
      - name: types
        run: mypy src/ratchet --ignore-missing-imports
      - name: tests
        # LOCAL backend: no docker, no network, so CI proves the same thing the demo does
        run: RATCHET_BACKEND=local python -m pytest -q
