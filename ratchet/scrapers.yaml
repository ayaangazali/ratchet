defaults:
  max_age_s: 86400
  fallback:
    url: null
    extract:
      section: changelog
      max_chars: 6000
      drop_patterns:
      - ^\s*\[Skip to content\].*$
      - ^\s*Edit this page.*$
    expect:
      min_chars: 300
      must_not_contain:
      - Just a moment
      - Enable JavaScript
      - Access denied
      - captcha
sources:
  fastapi:
    url: https://fastapi.tiangolo.com/release-notes/
    extract:
      section: '{version}'
      max_chars: 5000
    expect:
      min_chars: 200
      must_contain:
      - fastapi
  pydantic:
    url: https://docs.pydantic.dev/{version}/changelog/
    extract:
      section: v{version}
      max_chars: 6000
    expect:
      min_chars: 300
  httpx:
    url: https://www.python-httpx.org/changelog/
    extract:
      section: 0.27 (final release)
      max_chars: 4000
    expect:
      min_chars: 200
    history:
    - at: '2026-08-29T23:47:37Z'
      from: '{version}'
      to: 0.27 (final release)
      why:
      - 'section heading not found: ''0.27.0'''
  requests:
    url: https://requests.readthedocs.io/en/latest/community/updates/
    extract:
      section: '{version}'
      max_chars: 4000
    expect:
      min_chars: 200
papers:
  sources:
    arxiv:
      url: https://arxiv.org/search/?searchtype=all&query={query}&size=50
      zones:
      - isp_proxy1
      - isp_proxy2
      - mcp_unlocker
      parse:
        id_pattern: (?:arXiv:|/abs/)(\d{4}\.\d{4,5})
        authors_label: '^Authors?\s*:?\s*$|^Authors?\s*:'
        abstract_label: '^Abstract\s*:?\s*$|^Abstract\s*:'
        max_authors: 12
      expect:
        min_entries: 3
        min_chars: 800
        must_contain:
        - arXiv
    huggingface:
      url: https://huggingface.co/papers?q={query}
      zones:
      - mcp_unlocker
      - isp_proxy1
      parse:
        id_pattern: /papers/(\d{4}\.\d{4,5})
        authors_label: ^(Authors?|By)\b\s*:?
        abstract_label: ^(Abstract|Summary)\b\s*:?
        max_authors: 8
      expect:
        min_entries: 1
        min_chars: 400
        must_contain:
        - papers
    arxiv_abs:
      url: https://arxiv.org/abs/{id}
      zones:
      - isp_proxy1
      - isp_proxy2
      - mcp_unlocker
      expect:
        min_chars: 400
        must_contain:
        - Abstract
