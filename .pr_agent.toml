# Qodo configuration, committed on purpose: a reviewer configured deliberately
# beats a reviewer running on defaults, and the config is itself reviewable.

[config]
model = "anthropic/claude-sonnet-4-6"
fallback_models = ["gpt-5.2"]

[pr_reviewer]
require_security_review = true
require_tests_review = true
enable_review_labels_security = true
enable_review_labels_effort = true
persistent_comment = true
extra_instructions = """
This repository is a verifier for coding agents, so hold it to the standard it
enforces. Prioritise, in order:

1. Any change that could let an unverified patch be accepted -- a decision path that
   sets ACCEPTED outside gauntlet/score.py::decide, a gate that can be skipped, a
   short-circuit that returns green on error.
2. Leakage of held-out test names (`f2p_hidden`) into anything the agent can read:
   task_brief, Verdict.to_observation, bus events that reach a prompt.
3. Anything that weakens the sandbox: a dropped --network=none, a relaxed
   --pids-limit, shell=True, or user input interpolated into a shell string.
4. Path traversal in workspace.py, and any git call built by string concatenation.
5. Silent exception swallowing in the gauntlet -- an error that grades as a pass is
   the worst bug this codebase can have.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
max_number_of_calls = 3
focus_only_on_problems = true
suggestions_score_threshold = 6
commitable_code_suggestions = true

[pr_description]
generate_ai_title = false
