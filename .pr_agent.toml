# Qodo configuration, committed on purpose: a reviewer configured deliberately
# beats a reviewer running on defaults, and the config is itself reviewable.

[config]
model = "anthropic/claude-sonnet-4-6"
fallback_models = ["gpt-5.2"]

[pr_reviewer]
require_security_review = true
require_tests_review = true
enable_review_labels_security = true
enable_review_labels_effort = true
persistent_comment = true
extra_instructions = """
This repository is a verifier for coding agents, so hold it to the standard it
enforces. Prioritise, in order:

1. Any change that could let an unverified patch through -- a path that sets `green`
   outside verifier/gauntlet.py, a stage that can be skipped, a short-circuit that
   returns success on error.
2. Leakage of held-out test names (`f2p_hidden`) into anything the agent can read:
   context.assemble, GauntletResult.to_observation, bus events that reach a prompt.
3. Container orchestration creeping in: `docker run`, subprocess sandbox management,
   or a provider SDK. Sandboxes are the harness's job and that is deliberate.
4. `shell=True`, agent-influenced strings interpolated into shell commands, or git
   calls built by concatenation.
5. Silent exception swallowing in a verifier stage -- an error that grades as a pass
   is the worst bug this codebase can have.
6. A pruned node that is dropped without being parked at refs/ratchet/pruned/.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
max_number_of_calls = 3
focus_only_on_problems = true
suggestions_score_threshold = 6
commitable_code_suggestions = true

[pr_description]
generate_ai_title = false
